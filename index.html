<style>

  #game{display:block;width:min(100vw,calc(100vh*1.5));height:min(100vh,calc(100vw/1.5));cursor:crosshair;box-shadow:0 0 80px rgba(0,0,0,.95);background:#0a0806;touch-action:none}

  .netcode-panel p{margin:0 0 14px 0;font-size:13px;color:#a89c8c;line-height:1.5}
  .netcode-code{display:none;font-family:ui-monospace,Menlo,monospace;font-size:46px;letter-spacing:12px;font-weight:800;color:#ffd75e;text-align:center;background:#0a0806;border:2px dashed rgba(255,215,94,.55);border-radius:10px;padding:14px 8px 14px 20px;margin:6px 0 12px;user-select:all}
  .netcode-input{display:none;width:100%;box-sizing:border-box;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:40px;letter-spacing:14px;font-weight:800;text-transform:uppercase;color:#ffd75e;background:#0a0806;border:2px solid rgba(255,215,94,.5);border-radius:10px;padding:12px 8px 12px 22px;margin:6px 0 12px;outline:none}
  .netcode-input:focus{border-color:#ffd75e;box-shadow:0 0 18px rgba(255,215,94,.35)}
  .netcode-buttons{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .netcode-btn{padding:10px 18px;background:rgba(60,50,40,.95);color:#e8dcc0;border:2px solid rgba(255,255,255,.18);border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .netcode-btn:hover{background:rgba(90,70,50,1);border-color:#ffd75e;color:#ffd75e}
  .netcode-btn.primary{background:rgba(100,80,30,.9);border-color:#ffd75e;color:#ffd75e}
  .netcode-status{font-size:13px;color:#7ef0a8;margin-top:10px;min-height:20px}
  .netcode-status.err{color:#ff7777}
  .netcode-hint{font-size:11px;color:#8d8478;margin-top:10px;line-height:1.6}
</style>
</head>

function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw){
      const p=JSON.parse(raw);
      if(p&&typeof p==='object'){
        Object.assign(saveData,p);
        ['upgrades','achievements','defeatedBosses','heroWins','kills','bossKills','unlockedSkins','selectedSkin','unlockedCurios','modifierWins','unlockedPets','metaUpgrades','relicHistory','collectedRelics'].forEach(k=>{if(!saveData[k])saveData[k]={};});

        if(!saveData.bestRun)saveData.bestRun={kills:0,dmgDealt:0,dmgTaken:0,cards:0,coins:0,time:0,level:0,elites:0};
        if(!Array.isArray(saveData.leaderboard))saveData.leaderboard=[];
        if(!saveData.selectedPet)saveData.selectedPet='none';
        if(!saveData.skillTab)saveData.skillTab='skills';
        if(typeof saveData.crtEnabled!=='boolean')saveData.crtEnabled=false;
        if(typeof saveData.bestRunTime!=='number')saveData.bestRunTime=0;
        if(typeof saveData.bestBossRushTime!=='number')saveData.bestBossRushTime=0;
        if(typeof saveData.bestBossRushLevel!=='number')saveData.bestBossRushLevel=0;
        if(typeof saveData.achievementRewardsOn!=='boolean')saveData.achievementRewardsOn=true;
        if(!saveData.equippedRelic)saveData.equippedRelic='none';
        if(typeof saveData.bossRushUnlocked!=='boolean')saveData.bossRushUnlocked=false;
        if(typeof saveData.voidChampionDefeated!=='boolean')saveData.voidChampionDefeated=false;
        if(!Array.isArray(saveData.friends))saveData.friends=[];
        const ALL=['knight','wizard','rogue','cleric','jester','barbarian','druid','monk','bard','necromancer','alchemist'];
        ALL.forEach(h=>{if(!saveData.unlockedSkins[h])saveData.unlockedSkins[h]=['default'];if(!saveData.selectedSkin[h])saveData.selectedSkin[h]='default';});
        if(!Array.isArray(saveData.unlockedHeroes))saveData.unlockedHeroes=['knight','wizard'];
        ['knight','wizard'].forEach(h=>{if(saveData.unlockedHeroes.indexOf(h)<0)saveData.unlockedHeroes.push(h);});
        if(saveData.unlockedHeroes.indexOf('rogue')>=0&&!saveData.upgrades['rogue'])saveData.unlockedHeroes=saveData.unlockedHeroes.filter(h=>h!=='rogue');
      }
    }
  }catch(e){}
  if(!saveData.friendCode)saveData.friendCode=genFriendCode();
  if(!Array.isArray(saveData.friends))saveData.friends=[];
}

function isSkinUnlocked(hk,skin){if(skin.cost===0)return true;return (saveData.unlockedSkins[hk]||[]).indexOf(skin.id)>=0;}
function tryUnlockSkin(hk,skin){
  if(isSkinUnlocked(hk,skin))return false;
  if(saveData.shards<skin.cost){toast('Not enough Soul Shards!','#ff7777');sfxDeny();return false;}
  saveData.shards-=skin.cost;
  if(!saveData.unlockedSkins[hk])saveData.unlockedSkins[hk]=['default'];
  saveData.unlockedSkins[hk].push(skin.id);
  writeSave();checkAchievements();sfxUpgrade();toast('✔ '+skin.name+' unlocked!','#7ef0a8');
  return true;
}

function getSkill(id){return SKILLS.find(s=>s.id===id);}
function getSkillLevel(id){return saveData.upgrades[id]||0;}
function getSkillCost(s){const l=getSkillLevel(s.id);return l>=s.max?null:s.costs[l];}
function isSkillAvailable(s){const branch=SKILLS.filter(x=>x.branch===s.branch);const idx=branch.indexOf(s);if(idx<=0)return true;return getSkillLevel(branch[idx-1].id)>0;}
function canBuySkill(s){if(!isSkillAvailable(s))return false;if(getSkillLevel(s.id)>=s.max)return false;return saveData.shards>=(getSkillCost(s)||0);}
function buySkill(s){if(!canBuySkill(s)){sfxDeny();toast('Cannot buy!','#ff7777');return false;}saveData.shards-=getSkillCost(s);saveData.upgrades[s.id]=(saveData.upgrades[s.id]||0)+1;writeSave();checkAchievements();sfxUpgrade();toast('✔ '+s.name+' upgraded!','#7ef0a8');return true;}

const DEFAULT_BINDS={up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',special:'Space',interact:'KeyE'};
const BINDS=Object.assign({},DEFAULT_BINDS);
function isDown(a){return !!G.keys[BINDS[a]];}
function keyName(code){
  if(!code)return '?';
  if(code.startsWith('Key'))return code.slice(3).toUpperCase();
  if(code.startsWith('Digit'))return code.slice(5);
  if(code.startsWith('Arrow'))return code.slice(5).toUpperCase();

function roundRect(x,y,w,h,r){
  if(w<0){x+=w;w=-w;}if(h<0){y+=h;h=-h;}
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function wrapText(text,x,y,maxW,lh){
  const words=text.split(' ');let line='',yy=y;
  for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lh;}else line=test;}
  if(line)ctx.fillText(line,x,yy);
  return yy;
}
function drawHeart(x,y,s,color){

}

function initAudio(){if(actx)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}catch(e){}}
function startMusic(){
  initAudio();if(!actx||musicGain)return;

    musicGain=actx.createGain();musicGain.gain.value=.0001;musicGain.connect(actx.destination);
    musicOsc.o1=actx.createOscillator();musicOsc.o1.type='sine';musicOsc.o1.frequency.value=55;

    musicOsc.o3=actx.createOscillator();musicOsc.o3.type='sine';musicOsc.o3.frequency.value=110;
    const mix=actx.createGain();mix.gain.value=.5;
    musicOsc.lfo=actx.createOscillator();musicOsc.lfo.type='sine';musicOsc.lfo.frequency.value=.07;
    const lfoG=actx.createGain();lfoG.gain.value=2.5;

    musicOsc.o1.connect(mix);musicOsc.o2.connect(mix);musicOsc.o3.connect(mix);
    mix.connect(musicGain);
    musicOsc.o1.start();musicOsc.o2.start();musicOsc.o3.start();musicOsc.lfo.start();
    musicGain.gain.linearRampToValueAtTime(saveData.musicVol*.05,actx.currentTime+2);
    musicLayers.bassGain=actx.createGain();musicLayers.bassGain.gain.value=0;musicLayers.bassGain.connect(actx.destination);

    musicLayers.bassOsc.connect(musicLayers.bassGain);musicLayers.bassOsc.start();
    musicLayers.percGain=actx.createGain();musicLayers.percGain.gain.value=0;musicLayers.percGain.connect(actx.destination);

    musicLayers.chaosOsc=actx.createOscillator();musicLayers.chaosOsc.type='sawtooth';musicLayers.chaosOsc.frequency.value=218;
    musicLayers.chaosOsc.connect(musicLayers.chaosGain);musicLayers.chaosOsc.start();
    musicBossGain=actx.createGain();musicBossGain.gain.value=0;musicBossGain.connect(actx.destination);
    musicBossOsc=actx.createOscillator();musicBossOsc.type='sawtooth';musicBossOsc.frequency.value=41;
    const bm=actx.createGain();bm.gain.value=.3;

function updateMusicState(){
  if(!actx||!musicBossGain||!musicOsc.o2)return;
  let ns='calm';
  if(G.enemies.some(e=>e.type==='boss'||e.type==='miniboss'))ns='boss';
  else if(player&&player.hp/player.maxHp<=.25)ns='danger';
  if(ns===musicState)return;
  musicState=ns;
  try{
    if(ns==='boss'){musicOsc.o2.frequency.linearRampToValueAtTime(110,actx.currentTime+.6);musicBossGain.gain.linearRampToValueAtTime(.04*saveData.musicVol*20,actx.currentTime+.5);}
    else if(ns==='danger'){musicOsc.o2.frequency.linearRampToValueAtTime(73.4,actx.currentTime+.6);musicBossGain.gain.linearRampToValueAtTime(.02*saveData.musicVol*20,actx.currentTime+.5);}
    else{musicOsc.o2.frequency.linearRampToValueAtTime(82.4,actx.currentTime+.6);musicBossGain.gain.linearRampToValueAtTime(0,actx.currentTime+.5);}
  }catch(e){}
}
function updateMusicDepth(){
  if(!actx||!musicLayers.bassGain)return;
  const now=actx.currentTime;const v=saveData.musicVol;const lv=G.level;const endless=G.endless;
  const bassTarget=(lv>=11)?.006*v*20:0;
  const percTarget=(lv>=31)?.0035*v*20:0;
  const dissTarget=(lv>=61&&!endless)?.003*v*20:0;
  const chaosTarget=endless?.006*v*20:0;
  try{
    musicLayers.bassGain.gain.linearRampToValueAtTime(bassTarget,now+1.2);
    musicLayers.percGain.gain.linearRampToValueAtTime(percTarget,now+1.2);
    musicLayers.dissGain.gain.linearRampToValueAtTime(dissTarget,now+1.2);
    musicLayers.chaosGain.gain.linearRampToValueAtTime(chaosTarget,now+1.2);
    if(endless&&musicLayers.chaosOsc)musicLayers.chaosOsc.frequency.linearRampToValueAtTime(210+Math.random()*30,now+2);
  }catch(e){}
}
function toggleMusic(){
  if(!musicGain){startMusic();toast('🎵 Music ON','#88bbdd');return;}
  musicOn=!musicOn;
  try{
    musicGain.gain.linearRampToValueAtTime(musicOn?saveData.musicVol*.05:.0001,actx.currentTime+.3);
    if(musicLayers.bassGain)musicLayers.bassGain.gain.linearRampToValueAtTime(musicOn?.006*saveData.musicVol*20:0,actx.currentTime+.3);
    if(musicLayers.percGain)musicLayers.percGain.gain.linearRampToValueAtTime(musicOn?.0035*saveData.musicVol*20:0,actx.currentTime+.3);
    if(musicLayers.dissGain)musicLayers.dissGain.gain.linearRampToValueAtTime(musicOn?.003*saveData.musicVol*20:0,actx.currentTime+.3);
    if(musicLayers.chaosGain)musicLayers.chaosGain.gain.linearRampToValueAtTime(musicOn?.006*saveData.musicVol*20:0,actx.currentTime+.3);
  }catch(e){}
  toast(musicOn?'🎵 Music ON':'🔇 Music OFF','#88bbdd');
}
function updateMusicVol(){try{if(musicGain&&musicOn)musicGain.gain.linearRampToValueAtTime(saveData.musicVol*.05,actx.currentTime+.1);}catch(e){}}
function _tone(freq,dur,type,vol,endFreq,delay){
  if(!actx||!musicOn)return;
  try{
    const o=actx.createOscillator();const g=actx.createGain();
    const start=actx.currentTime+(delay||0);
    o.type=type||'square';
    o.frequency.setValueAtTime(freq,start);
    if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(40,endFreq),start+dur);
    const v=(vol||.035)*(saveData.sfxVol||1);
    g.gain.setValueAtTime(v,start);
    g.gain.exponentialRampToValueAtTime(.0001,start+dur);
    o.connect(g);g.connect(actx.destination);
    o.start(start);o.stop(start+dur+.03);
  }catch(e){}
}

function rollCardMin(minR){const i=RARITY_ORDER.indexOf(minR);const allowed=RARITY_ORDER.slice(i);const total=allowed.reduce((s,r)=>s+RARITY[r].weight,0);let roll=Math.random()*total;for(const r of allowed){roll-=RARITY[r].weight;if(roll<=0){const pool=CARDS.filter(c=>c.rarity===r);return pool[Math.floor(Math.random()*pool.length)];}}return CARDS.filter(c=>c.rarity===allowed[0])[0];}

const STATUS_META={burn:{icon:'🔥',color:'#ff8040'},freeze:{icon:'❄️',color:'#80d0ff'},poison:{icon:'☠️',color:'#6cd060'},shock:{icon:'⚡',color:'#ffe14d'}};
function applyStatus(entity,type,stacks,duration){
  if(!entity)return;
  if(entity.type==='boss'||entity.type==='miniboss')return;
  if(!entity.statuses)entity.statuses={};
  const s=entity.statuses[type]||{stacks:0,time:0,tick:0};
  s.stacks=Math.max(s.stacks,stacks||1);
  s.time=Math.max(s.time,duration||3);
  s.tick=s.tick||0;
  entity.statuses[type]=s;
  if(entity!==player&&entity!==player2){if(!G.statusesAppliedThisRun)G.statusesAppliedThisRun={};G.statusesAppliedThisRun[type]=true;}
}
function tickStatuses(entity,dt,isPlayer){
  if(!entity.statuses)return;
  const st=entity.statuses;
  if(st.burn&&st.burn.time>0){
    st.burn.time-=dt;st.burn.tick=(st.burn.tick||0)+dt;
    while(st.burn.tick>=.5){st.burn.tick-=.5;const dmg=st.burn.stacks*.6;if(isPlayer)dotPlayer(entity,dmg,'#ff8040');else dotEnemy(entity,dmg);spawnParticle(entity.x+rand(-6,6),entity.y-4,'#ff8040');}
    if(st.burn.time<=0)delete st.burn;
    if(entity.hp<=0)return;
  }
  if(st.poison&&st.poison.time>0){
    st.poison.time-=dt;st.poison.tick=(st.poison.tick||0)+dt;
    while(st.poison.tick>=1){st.poison.tick-=1;const dmg=st.poison.stacks*.5;if(isPlayer)dotPlayer(entity,dmg,'#6cd060');else dotEnemy(entity,dmg);spawnParticle(entity.x+rand(-6,6),entity.y-4,'#6cd060');}
    if(st.poison.time<=0)delete st.poison;
    if(entity.hp<=0)return;
  }
  if(st.freeze&&st.freeze.time>0){st.freeze.time-=dt;if(Math.random()<.2)spawnParticle(entity.x+rand(-8,8),entity.y-4,'#80d0ff');if(st.freeze.time<=0)delete st.freeze;}
  if(st.shock&&st.shock.time>0){st.shock.time-=dt;if(Math.random()<.4)spawnParticle(entity.x+rand(-8,8),entity.y-4,'#ffe14d');if(st.shock.time<=0)delete st.shock;}
}
function statusSpeedMul(entity){
  if(!entity.statuses)return 1;
  let m=1;
  if(entity.statuses.freeze&&entity.statuses.freeze.time>0)m*=.4;
  if(entity.statuses.shock&&entity.statuses.shock.time>0)m*=.15;
  return m;
}
function drawStatusIcons(entity,x,y,size){
  if(!entity.statuses)return;
  const keys=Object.keys(entity.statuses).filter(k=>entity.statuses[k]&&entity.statuses[k].time>0);
  if(!keys.length)return;
  ctx.font=(size||12)+'px system-ui';
  ctx.textAlign='left';ctx.textBaseline='middle';
  for(let i=0;i<keys.length;i++)ctx.fillText(STATUS_META[keys[i]].icon,x+i*(size+2),y);
}

function addFriend(code,name){code=normalizeCode(code);if(!code||code===saveData.friendCode)return;if(!Array.isArray(saveData.friends))saveData.friends=[];const ex=saveData.friends.find(f=>f.code===code);if(ex){ex.last=Date.now();if(name&&name!=='Player')ex.name=name;}else saveData.friends.unshift({code,name:name||('Friend '+code.slice(0,3)),last:Date.now()});if(saveData.friends.length>10)saveData.friends.length=10;writeSave();}
function copyText(txt){try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(()=>{});}
function netClose(){NET.connected=false;try{if(NET.conn)NET.conn.close();}catch(e){}try{if(NET.peer)NET.peer.destroy();}catch(e){}NET.conn=null;NET.peer=null;}
function netHostStart(){
  netClose();
  if(typeof Peer==='undefined'){netSetStatus('❌ PeerJS failed to load — check internet.',true);return;}
  NET.role='host';
  if(!saveData.friendCode){saveData.friendCode=genFriendCode();writeSave();}
  const code=saveData.friendCode;NET.code=code;
  netSetStatus('Creating room...',false);
  try{NET.peer=new Peer('mq-'+code,{debug:0});}catch(e){netSetStatus('❌ '+e.message,true);return;}
  NET.peer.on('open',()=>{netSetStatus('✅ Room ready! Waiting for your friend...',false);});
  NET.peer.on('connection',conn=>{if(NET.connected){try{conn.close();}catch(e){}return;}netSetupChannel(conn);});
  NET.peer.on('error',err=>{const ty=(err&&err.type)?err.type:'unknown';if(ty==='unavailable-id')netSetStatus('❌ That code is already in use.',true);else if(ty==='network'||ty==='server-error')netSetStatus('❌ Network error.',true);else netSetStatus('❌ '+ty,true);});
}
function netJoinWithCode(code){
  netClose();
  if(typeof Peer==='undefined'){netSetStatus('❌ PeerJS failed to load.',true);return;}
  code=normalizeCode(code);
  if(code.length!==6){netSetStatus('❌ Enter a 6-character code.',true);return;}
  NET.role='client';NET.code=code;
  netSetStatus('Connecting to '+code+'...',false);
  try{NET.peer=new Peer({debug:0});}catch(e){netSetStatus('❌ '+e.message,true);return;}
  NET.peer.on('open',()=>{const conn=NET.peer.connect('mq-'+code,{reliable:true});netSetupChannel(conn);setTimeout(()=>{if(!NET.connected)netSetStatus('❌ Could not reach '+code+'.',true);},15000);});
  NET.peer.on('error',err=>{const ty=(err&&err.type)?err.type:'unknown';if(ty==='peer-unavailable')netSetStatus('❌ No room found with code '+code+'.',true);else netSetStatus('❌ '+ty,true);});
}
function netSetupChannel(conn){
  NET.conn=conn;
  conn.on('open',()=>{NET.connected=true;netSetStatus('✅ Connected!',false);sfx(880,.20,'sine',.06);try{conn.send({t:'hello',code:saveData.friendCode,name:'Player'});}catch(e){}setTimeout(()=>{closeNetcodeOverlay();if(NET.role==='host'){G.coopMode='online-host';G.menuScreen='heroes';toast('🌐 Friend connected! Pick a hero to start.','#80d0ff');}else{G.coopMode='online-client';G.menuScreen='heroes';toast('🌐 Connected! Waiting for the host to start...','#80d0ff');}},700);});
  conn.on('data',netOnData);
  conn.on('close',()=>{NET.connected=false;toast('🔌 Friend disconnected','#ff7777');if(NET.role==='client'){G.state='menu';G.menuScreen='heroes';G.showRunSummary=false;}});
  conn.on('error',()=>{netSetStatus('❌ Connection error',true);});
}
function netSend(obj){try{if(NET.conn&&NET.connected&&NET.conn.open)NET.conn.send(obj);}catch(e){}}
function netOnData(msg){
  if(!msg||typeof msg!=='object')return;
  if(msg.t==='hello'){if(NET.role==='host')addFriend(msg.code,msg.name);return;}
  if(NET.role==='host'){
    if(msg.t==='input'&&msg.i)NET.remoteInput=msg.i;
    else if(msg.t==='special'){if(player2&&!player2.downed)useSpecial(player2);}
    else if(msg.t==='ui_click'){if(G.specialUI)handleSpecialUIClick({x:msg.x,y:msg.y});}
  }
  else if(NET.role==='client'){
    if(msg.t==='state')NET.lastState=msg;
    else if(msg.t==='start')netClientStart(msg);
    else if(msg.t==='card')netClientCard(msg);
    else if(msg.t==='toast')toast(msg.m,msg.c);
    else if(msg.t==='end'){G.state=msg.w?'victory':'gameover';G.showRunSummary=false;toast(msg.w?'🏆 Victory!':'💀 You died',msg.w?'#ffd75e':'#ff5566');}
  }
}
function netClientStart(msg){

  G.state='playing';G.menuScreen='heroes';startMusic();sfx(440,.12,'square',.05);
  toast('🌐 Run started!','#80d0ff');
}

}
function serializeSpecial(){
  if(!G.specialUI||!G.specialData)return null;
  const d=G.specialData;
  if(G.specialUI==='event')return{ui:'event',eventId:d.event.id,chosen:d.chosen,resolved:d.resolved};
  if(G.specialUI==='blacksmith')return{ui:'blacksmith',used:d.used};
  if(G.specialUI==='library')return{ui:'library',choices:d.choices.map(c=>c.name),chosen:d.chosen};
  if(G.specialUI==='casino')return{ui:'casino',bet:d.bet,message:d.message};
  if(G.specialUI==='shrine')return{ui:'shrine',curseId:d.curse.id,blessingId:d.blessing.id,resolved:d.resolved,accepted:d.accepted};
  return null;
}
function deserializeSpecial(s){
  if(!s){G.specialUI=null;G.specialData=null;return;}
  if(s.ui==='event'){
    const event=EVENTS.find(e=>e.id===s.eventId);
    if(!event){G.specialUI=null;return;}
    G.specialUI='event';G.specialData={event,chosen:s.chosen,resolved:s.resolved};
  } else if(s.ui==='blacksmith'){
    G.specialUI='blacksmith';G.specialData={used:s.used};
  } else if(s.ui==='library'){
    const choices=s.choices.map(n=>CARDS.find(c=>c.name===n)).filter(Boolean);
    G.specialUI='library';G.specialData={choices,chosen:s.chosen};
  } else if(s.ui==='casino'){
    G.specialUI='casino';G.specialData={bet:s.bet,message:s.message};
  } else if(s.ui==='shrine'){
    const curse=CURSES.find(c=>c.id===s.curseId);
    const blessing=BLESSINGS.find(b=>b.id===s.blessingId);
    if(!curse||!blessing){G.specialUI=null;return;}
    G.specialUI='shrine';G.specialData={curse,blessing,resolved:s.resolved,accepted:s.accepted};
  } else G.specialUI=null;
}

function randomEnemyPos(){
  const margin=70;
  const px=player?player.x:W/2;
  const py=player?player.y:ROOM.y+ROOM.h-90;
  for(let tries=0;tries<12;tries++){
    const side=Math.floor(Math.random()*4);
    let p;
    if(side===0)p={x:rand(ROOM.x+margin,ROOM.x+ROOM.w-margin),y:ROOM.y+margin};
    else if(side===1)p={x:rand(ROOM.x+margin,ROOM.x+ROOM.w-margin),y:ROOM.y+ROOM.h-margin};
    else if(side===2)p={x:ROOM.x+margin,y:rand(ROOM.y+margin,ROOM.y+ROOM.h-margin)};
    else p={x:ROOM.x+ROOM.w-margin,y:rand(ROOM.y+margin,ROOM.y+ROOM.h-margin)};
    if(Math.hypot(p.x-px,p.y-py)>160)return p;

function upgradeCard(card){
  const order=['common','rare','epic','legendary','mythic'];
  const idx=order.indexOf(card.rarity);
  if(idx<0||idx>=order.length-1)return false;
  const nextRar=order[idx+1];
  const pool=CARDS.filter(c=>c.rarity===nextRar);
  if(!pool.length)return false;
  const newCard=pool[Math.floor(Math.random()*pool.length)];
  const entry=CARDS.find(c=>c.name===card.name);
  if(entry&&entry.unapply)entry.unapply(player);
  newCard.apply(player);
  const i=player.cards.indexOf(card);
  if(i>=0)player.cards[i]=newCard;
  checkSynergies(player);
  writeSave();
  toast('⚒️ '+card.name+' → '+newCard.name+'!','#ffb038');
  return true;
}

function checkSynergies(p){
  if(!p)p=player;
  const owned=p.cards.map(c=>c.name);
  for(const syn of SYNERGIES){
    if(p.triggeredSynergies&&p.triggeredSynergies.indexOf(syn.name)>=0)continue;
    if(syn.cards.every(n=>owned.indexOf(n)>=0)){
      if(!p.triggeredSynergies)p.triggeredSynergies=[];
      p.triggeredSynergies.push(syn.name);
      syn.apply(p);
      if(!p.isPlayer2){
        saveData.combosTriggered=(saveData.combosTriggered||0)+1;
        writeSave();checkAchievements();
        addFloatText(p.x,p.y-60,'💥 COMBO: '+syn.name+'!','#ffd75e',26);
        for(let i=0;i<40;i++)spawnParticle(p.x+rand(-30,30),p.y+rand(-30,30),'#ffd75e');
        G.hitFreeze=.4;sfxCombo();
        toast('💥 COMBO! '+syn.icon+' '+syn.name+' — '+syn.desc,'#ffd75e');
      }
    }
  }

  if(NET.role==='host'&&NET.connected)netSend({t:'card',n:card.name});
  if(p.cards.length>saveData.bestCardsOneRun)saveData.bestCardsOneRun=p.cards.length;
  saveData.totalCards++;G.runStats.cards++;
  if(card.rarity==='legendary')saveData.legendaryFound=true;
  if(card.rarity==='mythic')saveData.mythicFound=true;
  checkSynergies(p);

  if(!player)return;
  if(G.state==='playing'){
    for(let i=G.pickups.length-1;i>=0;i--){
      const pk=G.pickups[i];
      if(pk.type==='card'&&dist(player,pk)<78){applyCard(pk.card);G.pickups.splice(i,1);G.tutorialCardPicked=true;return;}

function meleeAttack(p){

  if(p.rangedMelee==='spear'){range=p.spearRange;arc=p.spearArc;dmg=p.spearDmg*p.mods.damage;}
  if(p.rangedMelee==='hammer'){dmg=p.hammerDmg*p.mods.damage;}

  const crit=Math.random()<p.mods.critChance;

  G.swings.push({x:p.x,y:p.y,ang:p.aim,range,t:.14,max:.14});

}

/* ★★★ DAMAGE RULES ★★★
   Warden: 4× damage (weak to everything)
   Bosses & other minibosses: 0.5× damage (tanky)
   Everything else: 1× */
function damageEnemy(e,dmg,isCrit){
  if(!e||e.hp<=0)return;
  if(e.invuln&&e.invuln>0)return;
  if(e.key==='warden')dmg*=4;
  else if(e.type==='boss'||e.type==='miniboss')dmg*=.5;
  if(e.isShielder){
    if(Math.random()<.5){addFloatText(e.x,e.y-e.r-8,'BLOCKED','#c0c8d8',12);e.flash=.08;sfx(700,.08,'sine',.03);return;}
  }
  if(e.statuses){
    const s=e.statuses;
    const hasF=s.freeze&&s.freeze.time>0;
    const hasB=s.burn&&s.burn.time>0;
    const hasS=s.shock&&s.shock.time>0;
    const hasP=s.poison&&s.poison.time>0;
    if(hasF&&hasS){dmg*=1.4;addFloatText(e.x,e.y-e.r-20,'⚡ SHATTER','#80d0ff',14);}
    else if(hasF&&hasB){dmg*=1.6;addFloatText(e.x,e.y-e.r-20,'💥 THERMAL','#ff6040',14);}
    else if(hasS&&hasP){dmg*=1.5;addFloatText(e.x,e.y-e.r-20,'☠️ NEUROTOXIN','#6cd060',14);}
    else if(hasB&&hasP){dmg*=1.3;addFloatText(e.x,e.y-e.r-20,'🌋 TOXIC FLAME','#ff8040',14);}
  }
  e.hp-=dmg;e.flash=.12;
  G.runStats.dmgDealt+=dmg;
  const col=isCrit?'#ffd75e':'#ffe9a8';
  addDmgNumber(e.x+rand(-8,8),e.y-e.r-6,dmg,col,isCrit);
  if(isCrit)sfxCritHit();else sfxEnemyHit();
  if(e.hp<=0)killEnemy(e);
}
function dotEnemy(e,dmg){
  if(!e||e.hp<=0)return;
  if(e.invuln&&e.invuln>0)return;
  if(e.key==='warden')dmg*=4;
  else if(e.type==='boss'||e.type==='miniboss')dmg*=.5;
  e.hp-=dmg;
  G.runStats.dmgDealt+=dmg;

}

function handlePlayerZeroHp(p){

  G.killsThisRun++;G.runStats.kills++;

    for(let i=0;i<120;i++){const a=Math.random()*Math.PI*2;G.particles.push({x:e.x,y:e.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,life:1.6,max:1.6,r:4+Math.random()*4,color:['#9060d0','#a0f0ff','#c0ff60','#ffd060','#ff40ff'][i%5]});}
    for(let i=0;i<40;i++)G.pickups.push({type:'coin',x:e.x+rand(-60,60),y:e.y+rand(-60,60),r:9,t:0});

    let chance=e.type==='boss'?.9:.30;
    if(e.isEliteBoss)chance=Math.min(1,chance+.15);
    if(Math.random()<chance)dropRelic(e.x,e.y);
  }
  if(player&&player.relicBloodstone){player.killStreakCount=(player.killStreakCount||0)+1;if(player.killStreakCount>=10){player.killStreakCount=0;G.pickups.push({type:'heart',x:e.x,y:e.y,r:13,t:0});}}
  for(let i=0;i<14;i++)spawnParticle(e.x,e.y,e.color);
  sfxEnemyDeath();
  if(e.explodes){spawnShockwave(e.x,e.y,1,140,380,'#ff6060');if(dist(player,e)<150)applyStatus(player,'burn',1,2);G.shake=10;sfx(160,.25,'sawtooth',.05);}
  if(!isBossRush){
    const isBig=e.type==='boss'||e.type==='miniboss'||e.isElite;
    const coins=e.type==='boss'?(e.isEliteBoss?90:45):(e.type==='miniboss'?(e.isEliteBoss?36:18):(e.isElite?6:1+Math.floor(Math.random()*3)));
    for(let i=0;i<coins;i++)G.pickups.push({type:'coin',x:e.x+rand(-24,24),y:e.y+rand(-24,24),r:9,t:0});
    if(!G.activeModifiers.has('ironman')&&(Math.random()<.13||isBig))G.pickups.push({type:'heart',x:e.x+rand(-20,20),y:e.y+rand(-20,20),r:13,t:0});
  }
  for(const p of [player,player2]){if(!p)continue;if(p.mods.lifesteal>0){p.lifestealAcc+=p.mods.lifesteal;if(p.lifestealAcc>=1){p.lifestealAcc-=1;if(p.hp<p.maxHp){p.hp=Math.min(p.maxHp,p.hp+1);addDmgNumber(p.x,p.y-24,1,'#4ade80');}}}}
  if(e.type==='boss')G.shake=32;else if(e.type==='miniboss')G.shake=22;
  if(!isBossRush){writeSave();checkAchievements();}
}
function hurtPlayer(n,statusFrom,p){
  if(!p)p=player;
  if(p.invuln>0||p.hp<=0||p.downed)return;
  if(p.relicVoidCharm&&Math.random()<.08){addFloatText(p.x,p.y-30,'🛡️ BLOCK','#80d0ff',16);sfx(700,.15,'sine',.05);return;}
  if(p.relicDodge&&Math.random()<p.relicDodge){addFloatText(p.x,p.y-30,'💨 DODGE','#a0ffb0',14);return;}
  const diff=DIFFICULTIES[G.difficulty];
  const real=n*diff.playerDmgMul*(p.mods.dmgTakenMul||1);
  p.hp-=real;G.runStats.dmgTaken+=real;G.hitsThisRun++;
  p.invuln=.9;G.shake=14;G.flash=.25;
  addDmgNumber(p.x,p.y-26,real,'#ff5566');
  sfxHurtPlayer();
  if(statusFrom)applyStatus(p,statusFrom,1,2.5);
  if(p.hp<=0)handlePlayerZeroHp(p);
}
function onPlayerDeath(){
  const isBossRush=G.mode==='bossrush';
  G.state='gameover';G.showRunSummary=true;
  sfxPlayerDeath();
  if(NET.role==='host'&&NET.connected)netSend({t:'end',w:false});
  if(!isBossRush){
    if(G.statusesAppliedThisRun&&G.statusesAppliedThisRun.burn&&G.statusesAppliedThisRun.freeze&&G.statusesAppliedThisRun.poison&&G.statusesAppliedThisRun.shock)saveData.appliedAllStatusesInOneRun=true;
    if(G.hitsThisRun===0&&G.level>saveData.bestNoHitLevel)saveData.bestNoHitLevel=G.level;
    const earned=calcShardsEarned();
    saveData.shards+=earned;saveData.lifetimeShards+=earned;
    saveData.totalCoins+=G.coins;
    if(G.level>saveData.bestLevel&&G.level<=MAX_LEVEL)saveData.bestLevel=G.level;
    if(G.endless&&G.level>saveData.bestEndlessLevel)saveData.bestEndlessLevel=G.level;
    G.lastShardsEarned=earned;
    G.runStats.level=G.level;G.runStats.coins=G.coins;
    G.runStats.time=(performance.now()-G.runStats.startTime)/1000;
    const b=saveData.bestRun;
    if(G.runStats.kills>b.kills)b.kills=G.runStats.kills;
    if(G.runStats.dmgDealt>b.dmgDealt)b.dmgDealt=G.runStats.dmgDealt;
    if(G.runStats.cards>b.cards)b.cards=G.runStats.cards;
    if(G.runStats.coins>b.coins)b.coins=G.runStats.coins;
    if(G.runStats.level>b.level)b.level=G.runStats.level;
    if(G.runStats.elites>b.elites)b.elites=G.runStats.elites;
    addToLeaderboard(false);
    writeSave();checkAchievements();
  }else{G.lastShardsEarned=0;G.runStats.level=G.level;G.runStats.coins=G.coins;G.runStats.time=(performance.now()-G.runStats.startTime)/1000;writeSave();}
}
function calcShardsEarned(){
  let s=Math.floor(G.level/2)+Math.floor(G.coins/12)+G.bossesKilledThisRun*5+G.elitesKilledThisRun*2;
  if(G.endless)s=Math.floor(s*1.5);
  s=Math.floor(s*DIFFICULTIES[G.difficulty].shardMul);
  for(const id of G.activeModifiers){const m=MODIFIERS.find(x=>x.id===id);if(m)s=Math.floor(s*m.shardMul);}
  if(player&&player.relicShardBonus)s=Math.floor(s*(1+player.relicShardBonus));
  if(player&&player.metaShardGain)s=Math.floor(s*(1+player.metaShardGain));
  return Math.max(0,s);
}
function addToLeaderboard(isVictory){
  const score=G.runStats.level*100+G.runStats.kills*2+G.bossesKilledThisRun*500+G.coins*1+(isVictory?2000:0)+G.activeModifiers.size*500;
  const entry={score,level:G.runStats.level,hero:player.hero,heroName:HEROES[player.hero].name,difficulty:G.difficulty,mods:G.activeModifiers.size,kills:G.runStats.kills,coins:G.runStats.coins,elites:G.runStats.elites,victory:isVictory,date:Date.now()};
  saveData.leaderboard.push(entry);
  saveData.leaderboard.sort((a,b)=>b.score-a.score);
  if(saveData.leaderboard.length>10)saveData.leaderboard.length=10;
}
function onRoomCleared(){
  G.roomCleared=true;
  sfxLevelClear();
  if(G.level===MAX_LEVEL&&!G.endless&&isBossLevel()&&G.mode!=='bossrush'){
    G.state='victory';G.showRunSummary=true;
    if(NET.role==='host'&&NET.connected)netSend({t:'end',w:true});
    saveData.totalWins++;
    saveData.heroWins[player.hero]=true;
    saveData.bossRushUnlocked=true;
    if(G.difficulty==='nightmare')saveData.nightmareWins++;
    if(G.hitsThisRun===0)saveData.flawlessWin=true;
    for(const id of G.activeModifiers)saveData.modifierWins[id]=true;
    if(G.activeModifiers.size>=5)saveData.modifierWins['all']=true;
    if(G.coopMode!=='off')saveData.achievements._coopWin=true;
    const earned=calcShardsEarned()+50;
    saveData.shards+=earned;saveData.lifetimeShards+=earned;
    saveData.totalCoins+=G.coins;
    if(G.level>saveData.bestLevel)saveData.bestLevel=G.level;
    G.lastShardsEarned=earned;
    G.runStats.level=G.level;G.runStats.coins=G.coins;
    G.runStats.time=(performance.now()-G.runStats.startTime)/1000;
    addToLeaderboard(true);
    writeSave();checkAchievements();
    toast('🏆 Victory! Boss Rush unlocked!','#ffd75e');
    return;
  }
  const rt=ROOM_TYPES[G.roomType]||ROOM_TYPES.normal;
  if(G.mode!=='bossrush'){

      else{if(isDown('up'))my--;if(isDown('down'))my++;if(isDown('left'))mx--;if(isDown('right'))mx++;p.aim=Math.atan2(G.mouse.y-p.y,G.mouse.x-p.x);}
    }
    if(mx||my){const len=Math.hypot(mx,my);mx/=len;my/=len;const slipMul=G.hazards.some(h=>h.type==='slip')?1.35:1;const sp=p.speed*p.mods.speed*statusMul*hazardMul*slipMul;p.x+=mx*sp*dt;p.y+=my*sp*dt;}

function updateEnemies(dt){
  const n=G.enemies.length;
  for(let i=0;i<n;i++){
    const e=G.enemies[i];
    if(!e||e.hp<=0)continue;
    e.t+=dt;e.flash=Math.max(0,e.flash-dt);
    tickStatuses(e,dt,false);
    if(e.hp<=0)continue;
    if(e.invuln>0)e.invuln-=dt;
    if(e.type==='boss'||e.type==='miniboss')updateBossGeneric(e,dt);
    else{
      const speedMul=statusSpeedMul(e);
      const stunned=e.statuses&&e.statuses.shock&&e.statuses.shock.time>0;
      const effSpeed=e.speed*speedMul;
      if(stunned){}
      else if(e.splitsOnDeath)updateSplitter(e,dt,effSpeed);
      else if(e.links)updateLinker(e,dt,effSpeed);
      else if(e.charges)updateCharger(e,dt,effSpeed);
      else if(e.heals)updateHealer(e,dt,effSpeed);
      else if(e.isShielder)updateShielder(e,dt,effSpeed);
      else if(e.type==='silencer')updateSilencer(e,dt,effSpeed);
      else if(e.type==='mirror')updateMirror(e,dt,effSpeed);
      else if(e.type==='grappler')updateGrappler(e,dt,effSpeed);
      else if(e.type==='summoner')updateSummoner(e,dt,effSpeed);
      else if(e.type==='spider')updateSpider(e,dt,effSpeed);
      else if(e.type==='golem')updateGolem(e,dt,effSpeed);
      else if(e.phasing)updateGhost(e,dt,effSpeed);
      else if(e.shooter)updateSkeleton(e,dt,effSpeed);
      else if(e.erratic)updateBat(e,dt,effSpeed);
      else updateSlime(e,dt,effSpeed);
    }
    e.x=clamp(e.x,ROOM.x+e.r,ROOM.x+ROOM.w-e.r);
    e.y=clamp(e.y,ROOM.y+e.r,ROOM.y+ROOM.h-e.r);
  }
}

    else if(h.type==='lava'){const pulse=1+Math.sin(G.t*3+h.x)*.08;ctx.globalAlpha=.85;const g=ctx.createRadialGradient(h.x,h.y,h.r*.3,h.x,h.y,h.r*pulse);g.addColorStop(0,'#ffff80');g.addColorStop(.4,'#ff8020');g.addColorStop(1,'#800000');ctx.fillStyle=g;ctx.beginPath();ctx.arc(h.x,h.y,h.r*pulse,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}

function drawCardTooltip(card,anchorX,anchorY){
  if(!card)return;
  const rarity=RARITY[card.rarity];
  const pad=14;const maxW=320;
  const title=card.icon+'  '+card.name;
  const desc=card.desc;
  const synergies=SYNERGIES.filter(s=>s.cards.indexOf(card.name)>=0);
  const removable=canRemoveCard(card);
  ctx.font='bold 15px system-ui';
  const titleW=ctx.measureText(title).width;
  ctx.font='12px system-ui';
  let descMaxW=0;
  {const words=desc.split(' ');let line='';for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>240&&line){if(ctx.measureText(line).width>descMaxW)descMaxW=ctx.measureText(line).width;line=w;}else line=test;}if(line&&ctx.measureText(line).width>descMaxW)descMaxW=ctx.measureText(line).width;}
  ctx.font='11px system-ui';
  let maxSynW=0;
  for(const s of synergies){const w=ctx.measureText('  '+s.icon+' '+s.name+' — '+s.desc).width;if(w>maxSynW)maxSynW=w;}
  const lockW=(!removable?ctx.measureText('🔒 Cannot be removed at shop').width:0);
  const contentW=Math.max(titleW,descMaxW,maxSynW,lockW,200);
  const w=Math.min(maxW,contentW+pad*2);
  const h=pad*2+24+22+(synergies.length?22+synergies.length*16:0)+(!removable?18:0);
  let x=anchorX-w/2;let y=anchorY-h-14;
  x=clamp(x,8,W-w-8);y=clamp(y,8,H-h-8);
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=14;ctx.shadowOffsetY=4;
  ctx.fillStyle='rgba(10,8,6,.98)';roundRect(x,y,w,h,10);ctx.fill();
  ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.strokeStyle=rarity.color;ctx.lineWidth=2;roundRect(x,y,w,h,10);ctx.stroke();
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.font='bold 15px system-ui';ctx.fillStyle='#ffffff';
  ctx.fillText(title,x+pad,y+pad);
  ctx.font='bold 9px system-ui';ctx.textAlign='right';ctx.fillStyle=rarity.color;
  ctx.fillText(rarity.name.toUpperCase(),x+w-pad,y+pad+4);
  ctx.textAlign='left';ctx.font='12px system-ui';ctx.fillStyle='#e8dcc0';
  wrapText(desc,x+pad,y+pad+26,w-pad*2,15);
  let sy=y+pad+26+22;
  if(!removable){ctx.font='bold 10px system-ui';ctx.fillStyle='#8a8078';ctx.fillText('🔒 Cannot be removed at shop',x+pad,sy);sy+=16;}
  if(synergies.length){ctx.font='bold 10px system-ui';ctx.fillStyle='#ffd75e';ctx.fillText('💥 SYNERGIES',x+pad,sy);sy+=15;ctx.font='11px system-ui';ctx.fillStyle='#a89c8c';for(const s of synergies){ctx.fillText('  '+s.icon+' '+s.name+' — '+s.desc,x+pad,sy);sy+=15;}}
  ctx.restore();
}
function drawPickups(){

    else if(pk.type==='heart'){const bob=Math.sin(G.t*4+pk.x*.05)*3;drawHeart(pk.x,pk.y+bob,13,'#ff4d6d');}
    else if(pk.type==='relic'&&pk.relic){
      const bob=Math.sin(G.t*4+pk.x*.05)*3;
      const pulse=1+Math.sin(G.t*3)*.15;
      const g=ctx.createRadialGradient(pk.x,pk.y+bob,2,pk.x,pk.y+bob,40*pulse);

      ctx.globalAlpha=.6;ctx.fillStyle=g;ctx.beginPath();ctx.arc(pk.x,pk.y+bob,40*pulse,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle='#c08cff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(pk.x,pk.y+bob,22,0,Math.PI*2);ctx.stroke();
      ctx.font='24px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';

      ctx.fillStyle='#e8dcc0';ctx.font='bold 11px system-ui';

      ctx.strokeText(pk.relic.name,pk.x,pk.y+bob-34);
      ctx.fillText(pk.relic.name,pk.x,pk.y+bob-34);
    }
    else if(pk.type==='card'&&pk.card){
      const col=RARITY[pk.card.rarity].color;
      const pulse=1+Math.sin(G.t*3)*.09;
      const g=ctx.createRadialGradient(pk.x,pk.y,2,pk.x,pk.y,46*pulse);
      g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=.4;ctx.fillStyle=g;ctx.beginPath();ctx.arc(pk.x,pk.y,46*pulse,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(pk.x,pk.y,27,0,Math.PI*2);ctx.stroke();
      ctx.font='26px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';

      if(player&&dist(player,pk)<78){ctx.fillStyle='#ffffff';ctx.font='bold 15px system-ui';ctx.fillText(keyName(BINDS.interact),pk.x,pk.y-48);}
      if(G.mouse.x>pk.x-30&&G.mouse.x<pk.x+30&&G.mouse.y>pk.y-30&&G.mouse.y<pk.y+30){G.hoveredCard=pk.card;G.hoveredCardX=G.mouse.x;G.hoveredCardY=G.mouse.y;}
    }
  }
}
function drawPet(){
  if(!G.pet)return;

  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.ellipse(pet.x,pet.y+pet.r*.9,pet.r*.9,pet.r*.3,0,0,Math.PI*2);ctx.fill();
  const g=ctx.createRadialGradient(pet.x,pet.y,2,pet.x,pet.y,pet.r*2.4);
  g.addColorStop(0,hexA(pet.color,.35));g.addColorStop(1,hexA(pet.color,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(pet.x,pet.y,pet.r*2.4,0,Math.PI*2);ctx.fill();
  if(pet.type==='hound'){ctx.fillStyle=pet.color;ctx.beginPath();ctx.ellipse(pet.x,pet.y+bob,pet.r*1.1,pet.r*.7,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(pet.x+pet.r*.6,pet.y-pet.r*.3+bob,pet.r*.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(pet.x+pet.r*.8,pet.y-pet.r*.4+bob,2,0,Math.PI*2);ctx.fill();}
  else if(pet.type==='cat'){ctx.fillStyle=pet.color;ctx.beginPath();ctx.arc(pet.x,pet.y+bob,pet.r*.9,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(pet.x-8,pet.y-pet.r*.6+bob);ctx.lineTo(pet.x-12,pet.y-pet.r*1.2+bob);ctx.lineTo(pet.x-3,pet.y-pet.r*.8+bob);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(pet.x+8,pet.y-pet.r*.6+bob);ctx.lineTo(pet.x+12,pet.y-pet.r*1.2+bob);ctx.lineTo(pet.x+3,pet.y-pet.r*.8+bob);ctx.closePath();ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(pet.x-4,pet.y+bob-1,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(pet.x+4,pet.y+bob-1,2,0,Math.PI*2);ctx.fill();}

  else if(pet.type==='snake'){ctx.strokeStyle=pet.color;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();const tx=pet.lastPos.x||pet.x,ty=pet.lastPos.y||pet.y;ctx.moveTo(tx,ty);ctx.quadraticCurveTo(pet.x-15,pet.y+bob+5,pet.x,pet.y+bob);ctx.stroke();ctx.fillStyle=pet.color;ctx.beginPath();ctx.arc(pet.x,pet.y+bob,pet.r*.6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffdd44';ctx.beginPath();ctx.arc(pet.x-3,pet.y+bob-1,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(pet.x+3,pet.y+bob-1,2,0,Math.PI*2);ctx.fill();pet.lastPos.x=pet.x;pet.lastPos.y=pet.y;}
  ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=pet.color;

function drawMinibossCrystal(e,flashing,col){
  const t=e.t;const pulse=1+Math.sin(t*4)*.10;
  const auraG=ctx.createRadialGradient(e.x,e.y,e.r*.3,e.x,e.y,e.r*2.8*pulse);
  const hue=(t*40)%360;
  auraG.addColorStop(0,'hsla('+hue+',100%,70%,0.55)');
  auraG.addColorStop(.5,'hsla('+((hue+120)%360)+',100%,60%,0.22)');
  auraG.addColorStop(1,'hsla('+((hue+240)%360)+',100%,60%,0)');
  ctx.fillStyle=auraG;ctx.beginPath();ctx.arc(e.x,e.y,e.r*2.8*pulse,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*.9,e.r*.85,e.r*.32,0,0,Math.PI*2);ctx.fill();
  for(let i=0;i<4;i++){
    const a=(i/4)*Math.PI*2+t*1.2;const orbitR=e.r*1.55+Math.sin(t*3+i)*5;
    const sx=e.x+Math.cos(a)*orbitR;const sy=e.y+Math.sin(a)*orbitR;
    ctx.save();ctx.translate(sx,sy);ctx.rotate(a+t*1.5);
    const shardGrad=ctx.createLinearGradient(-6,-12,6,12);

    ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath();ctx.ellipse(a.x,a.y+a.r*.85,a.r*.85,a.r*.3,0,0,Math.PI*2);ctx.fill();
    if(a.type==='wolf'){ctx.fillStyle=a.color;ctx.beginPath();ctx.ellipse(a.x,a.y,a.r*1.1,a.r*.7,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(a.x+a.r*.6,a.y-a.r*.3,a.r*.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(a.x+a.r*.7,a.y-a.r*.4,2,0,Math.PI*2);ctx.fill();ctx.strokeStyle=a.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(a.x,a.y,a.r*1.4,0,Math.PI*2);ctx.stroke();}

    ctx.globalAlpha=1;

function drawEldenRingBar(boss){
  if(!boss||boss.barAlpha===undefined)return;
  const alpha=clamp(boss.barAlpha,0,1);if(alpha<=0)return;
  const bw=720,bh=24;
  const bx=(W-bw)/2,by=H-78;
  ctx.globalAlpha=alpha;
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.font='bold 24px Georgia, "Times New Roman", serif';
  ctx.shadowColor='rgba(0,0,0,.95)';ctx.shadowBlur=10;
  const nameCol=boss.isVoidChampion?'#ff40ff':(boss.isEliteBoss?'#ffcc44':'#e8dcc0');
  ctx.fillStyle=nameCol;
  ctx.fillText(boss.name.toUpperCase(),W/2,by-12);
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(6, 3, 0, .88)';roundRect(bx-8,by-5,bw+16,bh+10,3);ctx.fill();
  ctx.strokeStyle=boss.isVoidChampion?'#ff40ff':(boss.isEliteBoss?'#ffcc44':'#6a5430');
  ctx.lineWidth=1.5;roundRect(bx-5,by-2,bw+10,bh+4,2);ctx.stroke();
  const bgGrad=ctx.createLinearGradient(0,by,0,by+bh);
  bgGrad.addColorStop(0,'#0a0202');bgGrad.addColorStop(1,'#1c0808');
  ctx.fillStyle=bgGrad;ctx.fillRect(bx,by,bw,bh);
  const frac=clamp(boss.hp/boss.maxHp,0,1);
  const fillGrad=ctx.createLinearGradient(0,by,0,by+bh);
  if(boss.isVoidChampion){
    fillGrad.addColorStop(0,'#8040ff');fillGrad.addColorStop(.25,'#ff40ff');fillGrad.addColorStop(.5,'#ffd75e');fillGrad.addColorStop(.75,'#40ffff');fillGrad.addColorStop(1,'#8040ff');
  } else if(boss.isEliteBoss){
    fillGrad.addColorStop(0,'#b08020');fillGrad.addColorStop(.35,'#ffcc44');fillGrad.addColorStop(.7,'#b08020');fillGrad.addColorStop(1,'#6a4a0e');
  } else {
    fillGrad.addColorStop(0,'#a02020');fillGrad.addColorStop(.35,'#d43a3a');fillGrad.addColorStop(.7,'#a02020');fillGrad.addColorStop(1,'#6a0e0e');
  }
  ctx.fillStyle=fillGrad;ctx.fillRect(bx,by,bw*frac,bh);
  [0.33,0.66].forEach(p=>{const px=bx+bw*p;ctx.strokeStyle='#e8c870';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,by-2);ctx.lineTo(px,by+bh+2);ctx.stroke();});
  ctx.fillStyle='rgba(255,220,220,.18)';ctx.fillRect(bx,by,bw*frac,3);
  ctx.strokeStyle='#b09040';ctx.lineWidth=2;ctx.strokeRect(bx+.5,by+.5,bw-1,bh-1);
  ctx.strokeStyle='#e8c870';ctx.lineWidth=3;
  const cm=16;const ox=bx-8,oy=by-5,ow=bw+16,oh=bh+10;
  ctx.beginPath();ctx.moveTo(ox,oy+cm);ctx.lineTo(ox,oy);ctx.lineTo(ox+cm,oy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox+ow-cm,oy);ctx.lineTo(ox+ow,oy);ctx.lineTo(ox+ow,oy+cm);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,oy+oh-cm);ctx.lineTo(ox,oy+oh);ctx.lineTo(ox+cm,oy+oh);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox+ow-cm,oy+oh);ctx.lineTo(ox+ow,oy+oh);ctx.lineTo(ox+ow,oy+oh-cm);ctx.stroke();
  ctx.textAlign='right';ctx.font='bold 12px system-ui';
  ctx.fillStyle=boss.phase===3?'#ff2020':(boss.phase===2?'#ff9d5a':'#8d8478');
  ctx.fillText('PHASE '+boss.phase+' / 3',bx+bw,by-38);
  if(boss.isVoidChampion){ctx.textAlign='left';ctx.fillStyle='#ff40ff';ctx.font='bold 12px system-ui';ctx.fillText('🌌 VOID CHAMPION',bx,by-38);}
  else if(boss.isEliteBoss){ctx.textAlign='left';ctx.fillStyle='#ffcc44';ctx.fillText('👑 ELITE',bx,by-38);}
  ctx.globalAlpha=1;
}
function drawBossBar(){let t=G.enemies.find(e=>e.type==='boss');if(!t)t=G.enemies.find(e=>e.type==='miniboss');if(t)drawEldenRingBar(t);}
function drawBossIntro(){
  const intro=G.bossIntro;
  if(!intro)return;
  const k=1-intro.t/intro.max;
  const bgA=k<.2?k/.2*.75:(intro.t<.4?intro.t/.4*.75:.75);
  ctx.fillStyle='rgba(0,0,0,'+bgA+')';ctx.fillRect(0,0,W,H);
  for(const p of G.bossIntroParticles){ctx.globalAlpha=Math.max(0,p.life/p.max)*.8;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  const scale=k<.3?(.5+(k/.3)*.5):1;
  const alpha=k<.15?(k/.15):(intro.t<.4?intro.t/.4:1);
  ctx.globalAlpha=alpha;
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(scale,scale);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 14px system-ui';ctx.fillStyle=intro.color;
  ctx.shadowColor=intro.color;ctx.shadowBlur=30;
  const isVC=intro.name==='VOID CHAMPION';
  ctx.fillText(isVC?'🌌 ALL FIVE HAVE MERGED 🌌':(intro.isElite?'👑 ELITE — PREPARE TO DIE 👑':(intro.isMini?'⚔ MINIBOSS APPROACHES ⚔':'⚔ BOSS APPROACHES ⚔')),0,-50);
  ctx.shadowBlur=0;
  ctx.font='bold 56px Georgia, "Times New Roman", serif';
  ctx.strokeStyle='rgba(0,0,0,.95)';ctx.lineWidth=8;
  ctx.strokeText(intro.name.toUpperCase(),0,10);
  ctx.fillStyle='#ffffff';ctx.fillText(intro.name.toUpperCase(),0,10);
  ctx.strokeStyle=intro.color;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-200,55);ctx.lineTo(200,55);ctx.stroke();
  ctx.font='italic 16px Georgia, serif';ctx.fillStyle='#a89c8c';
  ctx.fillText(isVC?'— The trials are over. Face what remains. —':'— Prepare yourself —',0,85);
  ctx.restore();
  ctx.globalAlpha=1;
}
function drawPlayerEntity(p,isP2){

  if(p.berserkTime>0){const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,p.r*3);g.addColorStop(0,'rgba(255,60,30,.5)');g.addColorStop(1,'rgba(255,60,30,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);ctx.fill();}

  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(p.x,p.y+p.r*.9,p.r*.9,p.r*.35,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=3;ctx.stroke();
  if(p.hero==='jester'){ctx.fillStyle='#ff6fbf';ctx.beginPath();ctx.moveTo(p.x-8,p.y-p.r+2);ctx.lineTo(p.x-14,p.y-p.r-14);ctx.lineTo(p.x,p.y-p.r+2);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(p.x+8,p.y-p.r+2);ctx.lineTo(p.x+14,p.y-p.r-14);ctx.lineTo(p.x,p.y-p.r+2);ctx.closePath();ctx.fill();ctx.fillStyle='#ffd75e';ctx.beginPath();ctx.arc(p.x-14,p.y-p.r-14,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(p.x+14,p.y-p.r-14,3,0,Math.PI*2);ctx.fill();}
  const ex=Math.cos(p.aim)*4,ey=Math.sin(p.aim)*4;
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(p.x-5+ex,p.y-4+ey,4.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(p.x+5+ex,p.y-4+ey,4.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0a0a14';ctx.beginPath();ctx.arc(p.x-5+ex*1.5,p.y-4+ey*1.5,2.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(p.x+5+ex*1.5,p.y-4+ey*1.5,2.2,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  if(isP2){ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ffb038';ctx.fillText('P2',p.x,p.y-p.r-28);}
  if(p.downed){ctx.strokeStyle='#ff2020';ctx.lineWidth=3;ctx.setLineDash([6,4]);ctx.beginPath();ctx.arc(p.x,p.y,p.r+12,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);const barW=60,barH=6;const bxx=p.x-barW/2,byy=p.y-p.r-30;ctx.fillStyle='rgba(0,0,0,.7)';roundRect(bxx,byy,barW,barH,3);ctx.fill();ctx.fillStyle='#ff5050';roundRect(bxx,byy,barW*(p.downTimer/10),barH,3);ctx.fill();if(p.reviveProgress>0){ctx.fillStyle='rgba(0,0,0,.7)';roundRect(bxx,byy-10,barW,barH,3);ctx.fill();ctx.fillStyle='#7ef0a8';roundRect(bxx,byy-10,barW*(p.reviveProgress/2.5),barH,3);ctx.fill();}ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ff5050';ctx.fillText('DOWNED',p.x,p.y-p.r-44);}
  drawStatusIcons(p,p.x-20,p.y-p.r-16,14);

function drawShopItems(){

    const pulse=1+Math.sin(G.t*3+it.x)*.1;

    ctx.strokeStyle=col;ctx.lineWidth=3;roundRect(it.x-44,it.y-62,88,124,10);ctx.stroke();
    ctx.font='30px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(it.card.icon,it.x,it.y-30);
    ctx.fillStyle=col;ctx.font='bold 11px system-ui';
    ctx.fillText(RARITY[it.card.rarity].name.toUpperCase(),it.x,it.y+2);
    ctx.fillStyle='#e8e0d0';ctx.font='bold 12px system-ui';

    ctx.fillText('🪙 '+it.price,it.x,it.y+86);

  }
}

function handleSpecialUIClick(m){
  if(G.specialUI==='event'){

    for(let i=0;i<d.event.choices.length;i++){if(window._eventBtns&&window._eventBtns[i]&&pointInRect(m.x,m.y,window._eventBtns[i])){d.event.choices[i].effect();d.resolved=true;d.chosen=i;sfx(600,.10,'sine',.05);return;}}
    return;
  }
  if(G.specialUI==='blacksmith'){
    const d=G.specialData;
    if(window._bsmithContinueBtn&&pointInRect(m.x,m.y,window._bsmithContinueBtn)){closeSpecialRoom();return;}
    if(d.used)return;
    for(const key in (window._bsmithBtns||{})){const b=window._bsmithBtns[key];if(b&&!b.disabled&&pointInRect(m.x,m.y,b.rect)){if(upgradeCard(b.card)){d.used=true;sfxUpgrade();}return;}}

    return;
  }

function shopRemoveBtnRect(){return{x:W/2-250,y:ROOM.y+ROOM.h-60,w:240,h:40};}
function shopRerollBtnRect(){return{x:W/2+10,y:ROOM.y+ROOM.h-60,w:240,h:40};}
const REMOVE_COLS=4,REMOVE_W=145,REMOVE_H=105,REMOVE_GAP=10;
function removeCardRect(i){const cols=REMOVE_COLS;const c=i%cols,r=(i/cols)|0;const totalW=cols*REMOVE_W+(cols-1)*REMOVE_GAP;const startX=(W-totalW)/2;const totalRows=Math.ceil(Math.max(1,player.cards.length)/cols);const totalH=totalRows*REMOVE_H+(totalRows-1)*REMOVE_GAP;const startY=(H-totalH)/2+10;return{x:startX+c*(REMOVE_W+REMOVE_GAP),y:startY+r*(REMOVE_H+REMOVE_GAP),w:REMOVE_W,h:REMOVE_H};}
function removeBackBtnRect(){return{x:W/2-100,y:H-60,w:200,h:40};}
function canRemoveCard(card){const entry=CARDS.find(c=>c.name===card.name);return !!(entry&&entry.unapply);}
function tryRemoveCardFromPlayer(card){
  if(G.shopRemoveUsed){toast('Already removed a card this shop!','#ff7777');sfxDeny();return false;}
  if(G.coins<30){toast('Not enough coins!','#ff7777');sfxDeny();return false;}
  if(!canRemoveCard(card)){toast('This card cannot be removed!','#ff7777');sfxDeny();return false;}
  const entry=CARDS.find(c=>c.name===card.name);
  entry.unapply(player);
  const idx=player.cards.indexOf(card);if(idx>=0)player.cards.splice(idx,1);
  if(player.hp>player.maxHp)player.hp=player.maxHp;
  if(player.maxHp<1){player.maxHp=1;player.hp=1;}
  G.coins-=30;G.shopRemoveUsed=true;G.shopSubScreen='main';sfxUpgrade();toast('🗑 Removed: '+card.icon+' '+card.name,'#ff9d7a');
  return true;
}
function rerollShop(){
  if(G.freeRerolls>0){G.freeRerolls--;}else{
    if(G.coins<G.shopRerollCost){toast('Not enough coins! ('+G.shopRerollCost+'🪙)','#ff7777');sfxDeny();return;}
    G.coins-=G.shopRerollCost;G.shopRerollCost=G.shopRerollCost*2;
  }
  G.shopItems.length=0;
  const xs=[W/2-230,W/2,W/2+230];
  for(let i=0;i<3;i++){const card=rollCard();G.shopItems.push({card,x:xs[i],y:ROOM.y+ROOM.h/2+20,r:34,bought:false,price:PRICES[card.rarity]});}

}

      const hov=G.mouse.x>r.x&&G.mouse.x<r.x+r.w&&G.mouse.y>r.y&&G.mouse.y<r.y+r.h;
      ctx.fillStyle=!removable?'rgba(20,20,25,.7)':(hov?hexA(rarity.color,.30):'rgba(28,24,22,.92)');
      roundRect(r.x,r.y,r.w,r.h,8);ctx.fill();
      ctx.strokeStyle=!removable?'rgba(255,255,255,.08)':(hov?rarity.color:hexA(rarity.color,.55));
      ctx.lineWidth=hov&&removable?3:2;
      roundRect(r.x,r.y,r.w,r.h,8);ctx.stroke();
      ctx.font='30px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.globalAlpha=removable?1:.35;ctx.fillText(card.icon,r.x+r.w/2,r.y+30);ctx.globalAlpha=1;
      ctx.font='bold 11px system-ui';ctx.fillStyle=removable?'#ffffff':'#6a6058';
      wrapText(card.name,r.x+r.w/2,r.y+60,r.w-12,12);
      ctx.font='9px system-ui';ctx.fillStyle=removable?rarity.color:'#5a5048';
      ctx.fillText(rarity.name.toUpperCase(),r.x+r.w/2,r.y+92);
      if(!removable){ctx.fillStyle='#5a5048';ctx.font='11px system-ui';ctx.fillText('🔒',r.x+r.w-12,r.y+12);}
      if(hov){G.hoveredCard=card;G.hoveredCardX=G.mouse.x;G.hoveredCardY=G.mouse.y;}
    }
  }
  const bb=removeBackBtnRect();
  const hb=G.mouse.x>bb.x&&G.mouse.x<bb.x+bb.w&&G.mouse.y>bb.y&&G.mouse.y<bb.y+bb.h;
  ctx.fillStyle=hb?'rgba(60,50,40,.95)':'rgba(30,24,20,.9)';
  roundRect(bb.x,bb.y,bb.w,bb.h,8);ctx.fill();
  ctx.strokeStyle=hb?'#ffd75e':'rgba(255,255,255,.18)';ctx.lineWidth=2;
  roundRect(bb.x,bb.y,bb.w,bb.h,8);ctx.stroke();
  ctx.fillStyle=hb?'#ffd75e':'#c9b8a0';ctx.font='bold 15px system-ui';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✕ CANCEL (ESC)',bb.x+bb.w/2,bb.y+bb.h/2+1);
}
function getTouchPos(t){const r=cv.getBoundingClientRect();return{x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)};}
function touchHandler(e){
  e.preventDefault();initAudio();
  if(G.specialUI){
    for(const t of e.changedTouches){
      const m=getTouchPos(t);G.mouse.x=m.x;G.mouse.y=m.y;
      if(NET.role==='client'&&NET.connected){netSend({t:'ui_click',x:m.x,y:m.y});}
      else handleSpecialUIClick(m);
    }
    return;
  }
  if(G.state==='menu'){for(const t of e.changedTouches){const m=getTouchPos(t);G.mouse.x=m.x;G.mouse.y=m.y;handleMenuTap(m);}return;}
  if(G.state==='paused'){for(const t of e.changedTouches){const m=getTouchPos(t);G.mouse.x=m.x;G.mouse.y=m.y;for(const b of (window._pauseButtons||[])){if(pointInRect(m.x,m.y,b.rect)){if(b.id==='resume')closePause();else if(b.id==='restart')pauseRestart();else if(b.id==='quit')pauseQuit();return;}}}return;}
  if(G.state!=='playing'&&G.state!=='shop')return;
  for(const t of e.changedTouches){const m=getTouchPos(t);if(m.x>W-70&&m.y>55&&m.y<110&&m.x<W-10){openPause();return;}if(Math.hypot(m.x-(W-250),m.y-(H-90))<45){if(NET.role!=='client')tryInteract();return;}if(Math.hypot(m.x-(W-130),m.y-(H-280))<55){if(NET.role==='client'&&NET.connected)netSend({t:'special'});else useSpecial(player);return;}if(Math.hypot(m.x-(W-130),m.y-(H-140))<75){G.touchAttack=true;return;}if(m.x<W/2&&m.y>H*.35){G.touchJoystick.active=true;G.touchJoystick.ox=m.x;G.touchJoystick.oy=m.y;G.touchJoystick.x=m.x;G.touchJoystick.y=m.y;}}
}
function handleMenuTap(m){
  G.mouse.down=true;setTimeout(()=>{G.mouse.down=false;},30);
  if(G.state==='menu'){
    if(G.menuScreen==='heroes'){
      for(const d of DIFF_BUTTONS){const x=d.cx-d.w/2,y=d.cy-d.h/2;if(m.x>x&&m.x<x+d.w&&m.y>y&&m.y<y+d.h){G.difficulty=d.key;return;}}
      for(let i=0;i<MODIFIERS.length;i++){const r=modifierButtonRect(i);if(pointInRect(m.x,m.y,r)){const id=MODIFIERS[i].id;if(G.pendingModifiers.has(id))G.pendingModifiers.delete(id);else G.pendingModifiers.add(id);return;}}
      for(const b of (window._menuButtons||[])){
        if(pointInRect(m.x,m.y,b._rect)){
          if(b.action==='hub'){G.menuScreen='hub';return;}
          if(b.action==='back_to_heroes'){G.menuScreen='heroes';return;}
          if(b.action==='controls'){G.menuScreen='controls';return;}
          if(b.action==='upgrades'){G.menuScreen='upgrades';return;}
          if(b.action==='achievements'){G.menuScreen='achievements';G.achScroll=0;return;}
          if(b.action==='bestiary'){G.menuScreen='bestiary';G.bestiaryScroll=0;return;}
          if(b.action==='curiosities'){G.menuScreen='curiosities';return;}
          if(b.action==='relics'){G.menuScreen='relics';return;}
          if(b.action==='wardrobe'){G.menuScreen='wardrobe';return;}
          if(b.action==='coop'){G.menuScreen='coop';return;}
          if(b.action==='language'){G.menuScreen='language';return;}
          if(b.action==='theme'){G.menuScreen='theme';return;}
          if(b.action==='leaderboard'){G.menuScreen='leaderboard';return;}
          if(b.action==='bossrush'){if(!saveData.bossRushUnlocked){toast('🔒 Win the game to unlock Boss Rush!','#ff7777');return;}G.mode='bossrush_pending';toast('⚔️ Choose a hero!','#ff5a5a');return;}
          if(b.action==='crt'){saveData.crtEnabled=!saveData.crtEnabled;writeSave();return;}
          if(b.action==='reset'){if(confirm(t('reset_confirm'))){try{localStorage.removeItem(SAVE_KEY);}catch(e){}location.reload();}return;}
        }
      }
      for(const c of MENU_CARDS){const x=c.cx-c.w/2,y=c.cy-c.h/2;if(m.x>x&&m.x<x+c.w&&m.y>y&&m.y<y+c.h){if(NET.role==='client'&&NET.connected){toast('🌐 Waiting for the host...','#80d0ff');return;}if(G.mode==='bossrush_pending'){G.mode='normal';resetRunBossRush(c.key);}else resetRun(c.key);return;}}
    } else if(G.menuScreen==='hub'){
      for(const b of (window._menuButtons||[])){
        if(pointInRect(m.x,m.y,b._rect)){
          if(b.action==='back_to_heroes'){G.menuScreen='heroes';return;}
          if(b.action==='controls'){G.menuScreen='controls';return;}
          if(b.action==='upgrades'){G.menuScreen='upgrades';return;}
          if(b.action==='achievements'){G.menuScreen='achievements';G.achScroll=0;return;}
          if(b.action==='bestiary'){G.menuScreen='bestiary';G.bestiaryScroll=0;return;}
          if(b.action==='curiosities'){G.menuScreen='curiosities';return;}
          if(b.action==='relics'){G.menuScreen='relics';return;}
          if(b.action==='wardrobe'){G.menuScreen='wardrobe';return;}
          if(b.action==='coop'){G.menuScreen='coop';return;}
          if(b.action==='language'){G.menuScreen='language';return;}
          if(b.action==='theme'){G.menuScreen='theme';return;}
          if(b.action==='leaderboard'){G.menuScreen='leaderboard';return;}
          if(b.action==='crt'){saveData.crtEnabled=!saveData.crtEnabled;writeSave();return;}
          if(b.action==='reset'){if(confirm(t('reset_confirm'))){try{localStorage.removeItem(SAVE_KEY);}catch(e){}location.reload();}return;}
        }
      }
    } else if(G.menuScreen==='relics'){
      if(window._relicBackBtn&&pointInRect(m.x,m.y,window._relicBackBtn)){G.menuScreen='heroes';return;}
      if(window._relicUnequipBtn&&pointInRect(m.x,m.y,window._relicUnequipBtn)){saveData.equippedRelic='none';writeSave();return;}
      for(const b of (window._relicBtns||[])){if(pointInRect(m.x,m.y,b.rect)){if(!b.collected){toast('🔒 Not collected yet!','#ff7777');return;}saveData.equippedRelic=(saveData.equippedRelic===b.relic.id)?'none':b.relic.id;writeSave();return;}}
    } else if(G.menuScreen==='upgrades'){
      if(pointInRect(m.x,m.y,upgradeBackRect())){G.menuScreen='heroes';return;}
      for(let i=0;i<3;i++){const r=skillTabRect(i);if(pointInRect(m.x,m.y,r)){saveData.skillTab=(i===0)?'skills':(i===1?'unlocks':'meta');writeSave();return;}}
      if(saveData.skillTab==='meta'){for(const key in (window._metaBtns||{})){const b=window._metaBtns[key];if(b&&pointInRect(m.x,m.y,b.rect)){const u=b.upgrade;const lvl=saveData.metaUpgrades[u.id]||0;if(lvl>=u.max)return;const cost=u.costs[lvl];if(saveData.shards<cost){toast('Not enough shards!','#ff7777');return;}saveData.shards-=cost;saveData.metaUpgrades[u.id]=lvl+1;writeSave();sfxUpgrade();return;}}return;}
      if(saveData.skillTab==='skills'){for(let bi=0;bi<BRANCHES.length;bi++){const bks=SKILLS.filter(s=>s.branch===BRANCHES[bi].key);for(let ni=0;ni<bks.length;ni++){const r=skillNodeRect(bi,ni);if(pointInRect(m.x,m.y,r)){buySkill(bks[ni]);return;}}}}
      else{for(let i=0;i<HERO_UNLOCKS.length;i++){const r=unlockRect(i);if(pointInRect(m.x,m.y,r)){buyHeroUnlock(HERO_UNLOCKS[i]);return;}}const pcs=[{id:'none',name:'None',icon:'❌',desc:'No pet',color:'#8d8478'}].concat(PETS);for(let i=0;i<pcs.length;i++){const r=petCardRect(i);if(pointInRect(m.x,m.y,r)){const p=pcs[i];if(p.id==='none'||isPetUnlocked(p.id)){saveData.selectedPet=(saveData.selectedPet===p.id)?'none':p.id;writeSave();return;}else{tryUnlockPet(p);return;}}}}
    } else if(G.menuScreen==='achievements'){if(pointInRect(m.x,m.y,achBackRect())){G.menuScreen='heroes';return;}}
    else if(G.menuScreen==='bestiary'){if(pointInRect(m.x,m.y,bestBackRect())){G.menuScreen='heroes';return;}}
    else if(G.menuScreen==='coop'){if(pointInRect(m.x,m.y,{x:window._coopRects.bx,y:window._coopRects.by,w:window._coopRects.bw,h:window._coopRects.bh})){G.menuScreen='heroes';return;}if(pointInRect(m.x,m.y,{x:window._coopRects.lx,y:window._coopRects.ly,w:window._coopRects.lw,h:window._coopRects.lh})){G.coopMode='local';G.menuScreen='heroes';return;}if(pointInRect(m.x,m.y,{x:window._coopRects.hx,y:window._coopRects.hy,w:window._coopRects.hw,h:window._coopRects.hh})){netHostUI();return;}if(pointInRect(m.x,m.y,{x:window._coopRects.jx,y:window._coopRects.jy,w:window._coopRects.jw,h:window._coopRects.jh})){netJoinUI();return;}for(const f of (window._friendRects||[]))if(pointInRect(m.x,m.y,f.rect)){netJoinUI(f.code);return;}}
    else if(G.menuScreen==='leaderboard'){if(pointInRect(m.x,m.y,leaderboardBackRect())){G.menuScreen='heroes';return;}}
    else if(G.menuScreen==='controls'){if(pointInRect(m.x,m.y,controlsBackRect())){G.menuScreen='heroes';return;}}
    else if(G.menuScreen==='curiosities'){if(pointInRect(m.x,m.y,curioBackRect())){G.menuScreen='heroes';return;}}
    else if(G.menuScreen==='wardrobe'){if(pointInRect(m.x,m.y,wardBackRect())){G.menuScreen='heroes';return;}}
    else if(G.menuScreen==='language'){if(pointInRect(m.x,m.y,langBackRect())){G.menuScreen='heroes';return;}for(const b of (window._langBtns||[]))if(pointInRect(m.x,m.y,b.rect)){saveData.language=b.key;writeSave();return;}}
    else if(G.menuScreen==='theme'){if(pointInRect(m.x,m.y,themeBackRect())){G.menuScreen='heroes';return;}for(const b of (window._themeBtns||[]))if(pointInRect(m.x,m.y,b.rect)){saveData.theme=b.key;writeSave();return;}}
  }
}
cv.addEventListener('touchstart',touchHandler,{passive:false});
cv.addEventListener('touchmove',e=>{if(G.state==='menu'||G.state==='paused')return;e.preventDefault();for(const t of e.changedTouches){const m=getTouchPos(t);if(G.touchJoystick.active){G.touchJoystick.x=m.x;G.touchJoystick.y=m.y;}}},{passive:false});
cv.addEventListener('touchend',e=>{if(G.state!=='playing'&&G.state!=='shop'&&G.state!=='paused')return;e.preventDefault();for(const t of e.changedTouches){const m=getTouchPos(t);if(Math.hypot(m.x-(W-130),m.y-(H-140))<100)G.touchAttack=false;if(G.touchJoystick.active&&Math.hypot(m.x-G.touchJoystick.ox,m.y-G.touchJoystick.oy)<200)G.touchJoystick.active=false;}},{passive:false});
cv.addEventListener('touchcancel',e=>{G.touchAttack=false;G.touchJoystick.active=false;},{passive:false});
window.addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(G.rebindTarget){e.preventDefault();if(e.code==='Escape'){G.rebindTarget=null;return;}BINDS[G.rebindTarget]=e.code;G.rebindTarget=null;sfx(700,.12,'sine',.045);return;}
  G.keys[e.code]=true;
  const preventList=[BINDS.up,BINDS.down,BINDS.left,BINDS.right,BINDS.special,BINDS.interact,'Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  if(preventList.includes(e.code))e.preventDefault();
  if(e.repeat)return;
  if(e.code==='KeyM'){toggleMusic();return;}
  if(e.code==='Escape'){
    if(G.state==='shop'&&G.shopSubScreen==='remove'){G.shopSubScreen='main';return;}
    if(G.specialUI){return;}
    if(G.state==='playing'||G.state==='shop'){openPause();return;}
    else if(G.state==='paused'){closePause();return;}
    else if(G.state==='menu'){if(G.menuScreen!=='heroes'){G.menuScreen='heroes';G.rebindTarget=null;G.mode='normal';return;}}
  }
  if(G.state==='menu'){
    if(G.menuScreen==='heroes'){for(let i=0;i<9;i++)if(e.code==='Digit'+(i+1)){if(NET.role==='client'&&NET.connected)return;resetRun(HERO_ORDER[i]);return;}if(e.code==='Digit0')resetRun(HERO_ORDER[9]);if(e.code==='Minus')resetRun(HERO_ORDER[10]);}
    else if(G.menuScreen==='achievements'){if(e.code==='ArrowDown'){const t=Math.ceil(ACHIEVEMENTS.length/ACH_LAYOUT.cols)*(ACH_LAYOUT.cardH+ACH_LAYOUT.gapY);const mx=Math.max(0,t-(H-190));G.achScroll=clamp((G.achScroll||0)+30,0,mx);}if(e.code==='ArrowUp')G.achScroll=clamp((G.achScroll||0)-30,0,999999);}
    else if(G.menuScreen==='bestiary'){if(e.code==='ArrowDown'){const total=Object.keys(ENEMY_TYPES).length+BOSS_ORDER.length+MINIBOSS_POOL.length+1;const t=Math.ceil(total/BEST_LAYOUT.cols)*(BEST_LAYOUT.cardH+BEST_LAYOUT.gapY);const mx=Math.max(0,t-(H-170));G.bestiaryScroll=clamp((G.bestiaryScroll||0)+30,0,mx);}if(e.code==='ArrowUp')G.bestiaryScroll=clamp((G.bestiaryScroll||0)-30,0,999999);}
    return;
  }
  if(G.state==='paused')return;
  if(G.specialUI)return;
  if(G.state==='playing'){if(e.code===BINDS.special){if(NET.role==='client'&&NET.connected)netSend({t:'special'});else useSpecial(player);}if(e.code===BINDS.interact&&NET.role!=='client')tryInteract();return;}
  if(G.state==='shop'){if(G.shopSubScreen==='remove'){if(e.code==='Escape'){G.shopSubScreen='main';}return;}if(e.code===BINDS.interact&&NET.role!=='client')tryInteract();return;}
  if(G.state==='gameover'){if(e.code==='KeyR'||e.code==='Enter'||e.code==='Space'){G.state='menu';G.showRunSummary=false;}return;}
  if(G.state==='victory'){if(e.code==='Enter'||e.code==='Space'){if(G.mode==='bossrush'){G.state='menu';G.showRunSummary=false;}else{G.showRunSummary=false;startEndless();}}else if(e.code==='KeyR'){G.state='menu';G.showRunSummary=false;}return;}
});
window.addEventListener('keyup',e=>{G.keys[e.code]=false;});
window.addEventListener('blur',()=>{G.keys={};G.mouse.down=false;G.touchAttack=false;G.touchJoystick.active=false;});
function startEndless(){
  G.endless=true;G.level=MAX_LEVEL+1;G.coins+=100;
  player.hp=player.maxHp;if(player2)player2.hp=player2.maxHp;
  startLevel();updateMusicDepth();
  toast('♾️ Endless Mode started!','#00e5c0');sfx(660,.3,'sine',.06);
}
let lastTime=performance.now();
function loop(now){
  let dt=(now-lastTime)/1000;
  lastTime=now;
  if(dt>.05)dt=.05;
  if(dt<0)dt=0;
  update(dt);render();requestAnimationFrame(loop);
}
player=createPlayer('knight');
G.state='menu';
requestAnimationFrame(loop);
})();
</script>
</body>
